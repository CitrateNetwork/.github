name: Reusable Solidity CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing foundry.toml (default: repo root)'
        type: string
        default: '.'
      forge-test-args:
        description: 'Extra arguments appended to forge test'
        type: string
        default: '-vvv'
      slither-remappings:
        description: 'Slither --solc-remaps argument'
        type: string
        default: '@openzeppelin/=lib/openzeppelin-contracts/'
      run-slither:
        description: 'Run Slither static analysis (default false; expensive)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge version
        run: forge --version

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        run: forge test ${{ inputs.forge-test-args }}

  slither:
    if: ${{ inputs.run-slither }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python + Slither
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install slither-analyzer solc-select
          solc-select install 0.8.26 && solc-select use 0.8.26

      - name: Run Slither
        run: slither . --solc-remaps "${{ inputs.slither-remappings }}"
