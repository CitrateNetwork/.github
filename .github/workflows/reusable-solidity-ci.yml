name: Reusable Solidity CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing foundry.toml (default: repo root)'
        type: string
        default: '.'
      forge-test-args:
        description: 'Extra arguments appended to forge test'
        type: string
        default: '-vvv'
      slither-remappings:
        description: 'Slither --solc-remaps argument'
        type: string
        default: '@openzeppelin/=lib/openzeppelin-contracts/'
      run-slither:
        # GH-B-006: was `default: false`, so a caller adopting the three-line shim
        # without reading the input list got `forge test` and NO static analysis on
        # a Layer-1 blockchain codebase. A security gate must be the default, not an
        # opt-in. Callers that genuinely cannot afford it per-push opt out visibly
        # with `run-slither: false` (e.g. gate it to pull_request in their shim).
        description: 'Run Slither static analysis (default true)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge version
        run: forge --version

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        # GH-B-005 / DGH-005: forge-test-args via env: (shell data, not script).
        env:
          FORGE_TEST_ARGS: ${{ inputs.forge-test-args }}
        run: forge test $FORGE_TEST_ARGS

  slither:
    if: ${{ inputs.run-slither }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python + Slither
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install slither-analyzer solc-select
          solc-select install 0.8.26 && solc-select use 0.8.26

      - name: Run Slither
        # GH-B-005 / DGH-005: slither-remappings via env: (shell data, not script).
        env:
          SLITHER_REMAPPINGS: ${{ inputs.slither-remappings }}
        run: slither . --solc-remaps "$SLITHER_REMAPPINGS"
