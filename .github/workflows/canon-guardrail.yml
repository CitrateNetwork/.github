name: Canon guardrail

# The .github repo hosts the shared guardrail and self-checks with its local copy
# (no cross-repo fetch needed here).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce retired-claim canon (CC-1)
        run: bash scripts/canon-guardrail.sh .
