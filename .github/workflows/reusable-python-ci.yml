name: Reusable Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing pyproject.toml or setup.py (default: repo root)'
        type: string
        default: '.'
      python-version:
        description: 'Python version (default 3.11)'
        type: string
        default: '3.11'
      install-extra:
        description: 'Extras to install with pip (e.g. dev,test)'
        type: string
        default: 'dev'
      test-command:
        description: 'Command to run tests'
        type: string
        default: 'pytest -v'
      lint:
        description: 'Run ruff + mypy (default true)'
        type: boolean
        default: true
      dep-audit:
        description: 'Run pip-audit as a blocking dependency-CVE gate (default true)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - name: Install package
        # GH-B-005 / DGH-005: install-extra via env: (shell data, not script).
        env:
          INSTALL_EXTRA: ${{ inputs.install-extra }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${INSTALL_EXTRA}]"

      # GH-B-002: `|| echo "... not configured"` swallowed the tool's exit code
      # AND mislabelled a real violation as "not configured". Decide config
      # explicitly, then either skip or run-and-gate — a genuine lint/type error
      # now fails the job.
      - name: Lint (ruff)
        if: ${{ inputs.lint }}
        run: |
          pip install ruff
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || grep -q '^\[tool\.ruff' pyproject.toml 2>/dev/null; then
            ruff check .
          else
            echo "ruff not configured (no ruff.toml / [tool.ruff] in pyproject.toml) — skipping"
          fi

      - name: Type-check (mypy)
        if: ${{ inputs.lint }}
        run: |
          pip install mypy
          if [ -f mypy.ini ] || [ -f .mypy.ini ] || grep -q '^\[tool\.mypy' pyproject.toml 2>/dev/null || grep -q '^\[mypy\]' setup.cfg 2>/dev/null; then
            mypy .
          else
            echo "mypy not configured (no mypy.ini / [tool.mypy] / [mypy]) — skipping"
          fi

      - name: Test
        # GH-B-005 / DGH-005: test-command is an arbitrary-command primitive by
        # design (default `pytest -v`), but route it through env: so the caller's
        # value is not expanded into the script text by the ${{ }} preprocessor
        # before the shell runs. Callers must not forward untrusted event data
        # (PR titles, branch names) into this input.
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: $TEST_COMMAND

      # GH-B-001 / DGH-001 / FWA-X2: the blocking dependency-CVE gate, re-homed
      # from the inert `workflows/dep-cve-gate.yml` to where the Python code is.
      # pip-audit resolves the installed dependency set and exits non-zero on any
      # known-vuln, failing the job.
      - name: Dependency audit (pip-audit, blocking)
        if: ${{ inputs.dep-audit }}
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit
