name: Reusable secret scan

# GH-B-001 / DGH-001 / FWA-X1 / KEYSAFE-K1: the BLOCKING gitleaks gate, re-homed
# from the inert `workflows/secret-scan.yml`. That file lived at the repo root
# (outside .github/workflows/, so GitHub never dispatched it) AND was authored as
# an `on: push/pull_request` standalone (so no caller could `uses:` it either) —
# a control recorded as delivered that ran nowhere. This is the same gate as a
# `workflow_call` reusable, at the path GitHub actually reads, so every repo can
# inherit it with a three-line shim.
#
# gitleaks is installed from a version-pinned release with a SHA-256 checksum
# verified before extraction (the original piped an unverified tarball straight
# into /usr/local/bin). Uses the binary rather than gitleaks-action@v2 so no org
# licence key is required. `.gitleaks.toml` is honoured when the calling repo
# ships one, otherwise gitleaks' built-in ruleset applies.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: 'gitleaks release to pin (no leading v)'
        type: string
        default: '8.30.1'
      gitleaks-sha256:
        description: 'SHA-256 of gitleaks_<version>_linux_x64.tar.gz'
        type: string
        default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a re-introduced secret is caught

      - name: Install gitleaks (version + checksum pinned)
        env:
          GL_VERSION: ${{ inputs.gitleaks-version }}
          GL_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${tarball}"
          curl -sSL --proto '=https' --tlsv1.2 -o "$tarball" "$url"
          echo "${GL_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks (fails the build on any non-allowlisted finding)
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
          else
            gitleaks detect --source . --redact --no-banner
          fi
