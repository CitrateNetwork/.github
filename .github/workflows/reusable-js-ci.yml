name: Reusable JS/TS CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing package.json (default: repo root)'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version (default 20)'
        type: string
        default: '20'
      test-script:
        description: 'npm script to run for tests'
        type: string
        default: 'test'
      build-script:
        description: 'npm script to run for build (empty to skip)'
        type: string
        default: 'build'
      lint-script:
        description: 'npm script to run for lint (empty to skip)'
        type: string
        default: 'lint'
      package-manager:
        description: 'npm | pnpm | yarn (default npm)'
        type: string
        default: 'npm'
      dep-audit:
        description: 'Run a blocking dependency-CVE audit (high+; default true)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (no cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Detect lockfile + install
        run: |
          set -e
          if [[ "${{ inputs.package-manager }}" == "npm" ]]; then
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              echo "No package-lock.json — falling back to npm install"
              npm install --no-audit --no-fund
            fi
          elif [[ "${{ inputs.package-manager }}" == "pnpm" ]]; then
            npm install -g pnpm
            if [[ -f pnpm-lock.yaml ]]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          elif [[ "${{ inputs.package-manager }}" == "yarn" ]]; then
            if [[ -f yarn.lock ]]; then
              yarn install --frozen-lockfile
            else
              yarn install
            fi
          fi

      # GH-B-002: lint is a BLOCKING gate. To opt out, a caller passes
      # `lint-script: ''` in its `with:` block — a visible, reviewable choice —
      # never a hidden continue-on-error. A named-but-missing script is an error,
      # not a silent skip (no more "green badge over nothing").
      - name: Lint
        if: ${{ inputs.lint-script != '' }}
        run: |
          if jq -e ".scripts[\"${{ inputs.lint-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.lint-script }}
          else
            echo "::error::lint-script '${{ inputs.lint-script }}' not found in package.json. Add it, or pass lint-script: '' to opt out."
            exit 1
          fi

      - name: Build
        if: ${{ inputs.build-script != '' }}
        run: |
          if jq -e ".scripts[\"${{ inputs.build-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.build-script }}
          else
            echo "::error::build-script '${{ inputs.build-script }}' not found in package.json. Add it, or pass build-script: '' to opt out."
            exit 1
          fi

      - name: Test
        if: ${{ inputs.test-script != '' }}
        run: |
          if jq -e ".scripts[\"${{ inputs.test-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.test-script }}
          else
            echo "::error::test-script '${{ inputs.test-script }}' not found in package.json. Add tests, or pass test-script: '' to opt out deliberately."
            exit 1
          fi

      # GH-B-001 / DGH-001 / FWA-X2: the blocking dependency-CVE gate, re-homed
      # from the inert `workflows/dep-cve-gate.yml` to where the JS code is.
      # Fails on any advisory at high or above against what ships to consumers.
      - name: Dependency audit (blocking, high+)
        if: ${{ inputs.dep-audit }}
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm audit --audit-level=high --omit=dev ;;
            pnpm) pnpm audit --audit-level high --prod ;;
            yarn) yarn audit --level high --groups dependencies ;;
          esac
