name: Reusable JS/TS CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing package.json (default: repo root)'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version (default 20)'
        type: string
        default: '20'
      test-script:
        description: 'npm script to run for tests'
        type: string
        default: 'test'
      build-script:
        description: 'npm script to run for build (empty to skip)'
        type: string
        default: 'build'
      lint-script:
        description: 'npm script to run for lint (empty to skip)'
        type: string
        default: 'lint'
      package-manager:
        description: 'npm | pnpm | yarn (default npm)'
        type: string
        default: 'npm'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (no cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Detect lockfile + install
        run: |
          set -e
          if [[ "${{ inputs.package-manager }}" == "npm" ]]; then
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              echo "No package-lock.json — falling back to npm install"
              npm install --no-audit --no-fund
            fi
          elif [[ "${{ inputs.package-manager }}" == "pnpm" ]]; then
            npm install -g pnpm
            if [[ -f pnpm-lock.yaml ]]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          elif [[ "${{ inputs.package-manager }}" == "yarn" ]]; then
            if [[ -f yarn.lock ]]; then
              yarn install --frozen-lockfile
            else
              yarn install
            fi
          fi

      - name: Lint
        if: ${{ inputs.lint-script != '' }}
        continue-on-error: true
        run: |
          if jq -e ".scripts[\"${{ inputs.lint-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.lint-script }}
          else
            echo "No ${{ inputs.lint-script }} script — skipping"
          fi

      - name: Build
        if: ${{ inputs.build-script != '' }}
        run: |
          if jq -e ".scripts[\"${{ inputs.build-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.build-script }}
          else
            echo "No ${{ inputs.build-script }} script — skipping"
          fi

      - name: Test
        run: |
          if jq -e ".scripts[\"${{ inputs.test-script }}\"]" package.json > /dev/null; then
            ${{ inputs.package-manager }} run ${{ inputs.test-script }}
          else
            echo "::warning::No ${{ inputs.test-script }} script in package.json — skipping. Add tests when ready."
          fi
