name: secret-scan

# SECREM-02 Phase 0.4 / KEYSAFE-K1 — gitleaks gate.
# FWA-X1 (2026-06-20 federation-wide audit): flipped from scheduled/soft to a
# BLOCKING gate that runs on every push AND pull_request and FAILS the build on
# a real leak. The 4 handoff "hits" were false positives (0x.. 42-char EVM
# addresses + the WebAuthnP256Validator constant) and are now allowlisted in
# .gitleaks.toml via the `0x[0-9a-fA-F]{40}` regex; a real high-entropy secret
# still trips (RED proof recorded in the FWA remediation log).
#
# NOTE (FUA-META-04 / Phase 0.6): third-party actions below are tag-pinned for
# readability; replace each `@vN` with a full commit SHA as part of the 0.6
# action-pinning sweep.

on:
  push:
    branches: ['**']            # FWA-X1: every branch, not just main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4   # TODO 0.6: pin to SHA
        with:
          fetch-depth: 0            # full history so a re-introduced secret is caught
      - name: gitleaks
        # FWA-X1: this step is the gate. It exits non-zero on any finding that
        # is not allowlisted in .gitleaks.toml, which fails the job (no
        # continue-on-error, no `|| true`) and therefore blocks the merge.
        uses: gitleaks/gitleaks-action@v2   # TODO 0.6: pin to SHA
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_ENABLE_SUMMARY / upload kept default; the action's default
          # behavior is to fail the run when leaks are found.
